[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tenir-conformance-s1"
version = "0.1.0"
description = "S1 executable conformance harness for TENIR / REG (G0+G1)"
requires-python = ">=3.10"
dependencies = ["cryptography>=42,<47", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tenir_conformance.membrane" = ["trust_root.yaml"]
