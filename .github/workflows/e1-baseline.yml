name: E1 baseline experiment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e1-baseline.yml"
      - "experiments/e1_e2/e1_baseline.py"
      - "src/tenir_conformance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local package
        run: python -m pip install -e .
      - name: Run corrected E1 baseline
        shell: bash
        run: |
          set -o pipefail
          python experiments/e1_e2/e1_baseline.py | tee experiments/e1_e2/e1_results.txt
      - name: Compute SHA-256 for run record
        working-directory: experiments/e1_e2
        run: |
          sha256sum e1_baseline.py
          sha256sum e1_results.txt
          sha256sum e2_explore.py
          sha256sum r6_adversarial.json r6_false_attest.json r8_honest.json r8_hidden_honest.json
      - name: Upload E1 run output
        uses: actions/upload-artifact@v4
        with:
          name: e1-baseline-results
          path: experiments/e1_e2/e1_results.txt
          if-no-files-found: error
