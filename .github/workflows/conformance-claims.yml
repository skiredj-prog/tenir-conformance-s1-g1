name: Conformance claim registry
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python conformance/validate_claims.py
      - run: python -m unittest discover -s conformance/tests -v
