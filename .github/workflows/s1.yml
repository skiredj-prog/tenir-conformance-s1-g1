name: Membrane CI (S1 + S2 + T7/T8)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run S1 harness tests
        run: python -m pytest tests/test_s1.py -v --tb=short

      - name: Install real TENIR subject
        run: pip install "git+https://github.com/skiredj-prog/tenir_governance.git"

      - name: Probe real TENIR PolicyEngine
        run: python -m pytest experiments/real_tenir/test_s1_policy_subject.py -v --tb=short

      - name: Run S1 membrane with real TENIR kernel
        run: python -m pytest tests/test_s1_real_kernel_membrane.py -v --tb=short

      - name: Run S2 Qualification Timeout membrane tests
        run: python -m pytest tests/test_s2_qualification_timeout.py -v --tb=short

      - name: Run T7/T8 FAILED + retry_eligible tests
        run: python -m pytest tests/test_t7_t8_failed_retry.py -v --tb=short

      - name: Generate S1 evidence artifacts
        run: PYTHONPATH=src python tools/run_s1.py

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: s1-evidence
          path: artifacts/s1/
