name: Membrane CI (S1–S11 + T7/T8)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run S1 harness tests
        run: python -m pytest tests/test_s1.py -v --tb=short

      - name: Run nonce binding and HARD_VETO lifecycle tests
        run: python -m pytest tests/test_nonce_and_kernel_veto.py -v --tb=short

      - name: Install real TENIR subject
        run: pip install "git+https://github.com/skiredj-prog/tenir_governance.git"

      - name: Probe real TENIR PolicyEngine
        run: python -m pytest experiments/real_tenir/test_s1_policy_subject.py -v --tb=short

      - name: Run S1 membrane with real TENIR kernel
        run: python -m pytest tests/test_s1_real_kernel_membrane.py -v --tb=short

      - name: Run S2 Qualification Timeout membrane tests
        run: python -m pytest tests/test_s2_qualification_timeout.py -v --tb=short

      - name: Run T7/T8 FAILED + retry_eligible tests
        run: python -m pytest tests/test_t7_t8_failed_retry.py -v --tb=short

      - name: Run S3 Duplicate Request membrane tests
        run: python -m pytest tests/test_s3_duplicate_request.py -v --tb=short

      - name: Run S4 Stale Receipt membrane tests
        run: python -m pytest tests/test_s4_stale_receipt.py -v --tb=short

      - name: Run G0 S5 Contradictory Evidence tests
        run: python -m pytest tests/test_g0_s5.py -v --tb=short

      - name: Run G0 S6 Reconciliation tests
        run: python -m pytest tests/test_g0_s6_reconciliation.py -v --tb=short

      - name: Run G0 S7 Ed25519 attestation tests
        run: python -m pytest tests/test_g0_s7.py -v --tb=short

      - name: Run G0 S8 concurrent admission tests
        run: python -m pytest tests/test_g0_s8_concurrent_admission.py -v --tb=short

      - name: Generate S8 concurrency evidence artifacts
        run: PYTHONPATH=src python tools/run_s8.py

      - name: Run G0 S10 signed TAU scope tests
        run: python -m pytest tests/test_g0_s10_tau_scope.py -v --tb=short

      - name: Run G0 S11 Transition object tests
        run: python -m pytest tests/test_g0_s11_transition.py -v --tb=short

      - name: Run ND-1 Realm policy divergence gate
        run: python -m pytest tests/test_s12_nd1_realm_divergence.py -v --tb=short

      - name: Run S12 cross-Realm conformance cases (S12a, b, d–h; S12c is ND-1)
        run: python -m pytest tests/test_s12_cross_realm_conformance.py -v --tb=short

      - name: Run E2 bounded state exploration (all four worlds; no historical count gate)
        run: |
          set -euo pipefail
          for world in honest false_attest hidden_honest adversarial; do
            python experiments/e1_e2/e2_explore.py --depth 8 --world "$world" --out "/tmp/e2-$world.json"
          done
          python - <<'PY'
          import json
          for world in ("honest", "false_attest", "hidden_honest", "adversarial"):
              with open(f"/tmp/e2-{world}.json", encoding="utf-8") as f:
                  result = json.load(f)
              actual = result["distinct_states"]
              violations = result["violations"]
              print(f'{world}: distinct_states={actual}, transitions_checked={result["transitions_checked"]}, violations={violations}')
              if violations:
                  raise SystemExit(f"INVARIANT VIOLATION in {world}: {violations}")
          print("E2 completed in all four worlds with no invariant violations. Historical state counts are not a CI gate because the pre-PR#6 explorer/membrane pair is unrecoverable.")
          PY


      - name: Generate S1 evidence artifacts
        run: PYTHONPATH=src python tools/run_s1.py

      - name: Upload S1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s1-evidence
          path: artifacts/s1/
          if-no-files-found: warn

      - name: Upload S2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s2-evidence
          path: artifacts/s2/
          if-no-files-found: warn

      - name: Upload S3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s3-evidence
          path: artifacts/s3/
          if-no-files-found: warn

      - name: Upload S4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s4-evidence
          path: artifacts/s4/
          if-no-files-found: warn

      - name: Upload S5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s5-evidence
          path: artifacts/s5/
          if-no-files-found: error

      - name: Upload S6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s6-evidence
          path: artifacts/s6/
          if-no-files-found: error

      - name: Upload S7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s7-evidence
          path: artifacts/s7/
          if-no-files-found: error

      - name: Upload S8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s8-evidence
          path: artifacts/s8/
          if-no-files-found: error

      - name: Upload S10 TAU scope evidence
        uses: actions/upload-artifact@v4
        with:
          name: s10-evidence
          path: artifacts/s10/
          if-no-files-found: error

      - name: Upload S11 Transition evidence
        uses: actions/upload-artifact@v4
        with:
          name: s11-evidence
          path: artifacts/s11/
          if-no-files-found: error
