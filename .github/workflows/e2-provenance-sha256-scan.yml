name: E2 provenance SHA-256 object scan

on:
  push:
    branches:
      - forensics/e2-provenance-sha256-20261009

permissions:
  contents: read

jobs:
  scan-git-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan all advertised refs and available Git blob objects
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Remote branches: $(git branch -r | wc -l)"
          sha256sum experiments/e1_e2/e2_explore.py
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          HISTORICAL = "d1488e806b4a784f7776f9ce0979b66034f7bf3076b9f7f19b19cf22cd64f6a0"
          SCRIPT_PATH = "experiments/e1_e2/e2_explore.py"
          head_digest = hashlib.sha256(Path(SCRIPT_PATH).read_bytes()).hexdigest()

          def git(*args, check=True):
              return subprocess.run(["git", *args], check=check, capture_output=True)

          refs = git("for-each-ref", "--format=%(refname)", "refs/remotes/origin").stdout.decode().splitlines()
          ref_versions = []
          for ref in refs:
              item = git("rev-parse", f"{ref}:{SCRIPT_PATH}", check=False)
              if item.returncode:
                  continue
              oid = item.stdout.decode().strip()
              body = git("cat-file", "blob", oid).stdout
              digest = hashlib.sha256(body).hexdigest()
              ref_versions.append({"ref": ref, "git_blob_oid": oid, "sha256": digest, "bytes": len(body)})

          listing = git("cat-file", "--batch-all-objects",
                        "--batch-check=%(objectname) %(objecttype) %(objectsize)").stdout.decode().splitlines()
          blob_oids = [line.split()[0] for line in listing
                       if len(line.split()) == 3 and line.split()[1] == "blob"]
          payload = "".join(oid + "\n" for oid in blob_oids).encode("ascii")
          raw = subprocess.run(["git", "cat-file", "--batch"], input=payload, check=True, capture_output=True).stdout

          pos, found = 0, {}
          for _ in blob_oids:
              end = raw.find(b"\n", pos)
              if end < 0:
                  raise RuntimeError(f"Malformed cat-file header at offset {pos}")
              header = raw[pos:end].decode("ascii").split()
              if len(header) != 3:
                  raise RuntimeError(f"Malformed cat-file header: {header!r}")
              oid, obj_type, size_text = header
              size = int(size_text)
              start = end + 1
              blob = raw[start:start + size]
              if len(blob) != size or raw[start + size:start + size + 1] != b"\n":
                  raise RuntimeError(f"Malformed blob payload: {oid}")
              digest = hashlib.sha256(blob).hexdigest()
              if digest in (HISTORICAL, head_digest):
                  found.setdefault(digest, []).append({"git_blob_oid": oid, "size": size})
                  if digest == HISTORICAL:
                      (Path(os.environ["RUNNER_TEMP"]) / "e2_explore_d1488e80.py").write_bytes(blob)
              pos = start + size + 1

          if head_digest not in found:
              raise SystemExit("Scanner control failed: HEAD script blob absent from object scan")

          history = []
          for rows in found.values():
              for row in rows:
                  row["history"] = git("log", "--all", f"--find-object={row['git_blob_oid']}",
                                       "--oneline").stdout.decode().splitlines()

          result = {
              "head": git("rev-parse", "HEAD").stdout.decode().strip(),
              "historical_sha256": HISTORICAL,
              "head_script_sha256": head_digest,
              "git_object_records": len(listing),
              "blob_objects_scanned": len(blob_oids),
              "script_versions_on_advertised_remote_refs": ref_versions,
              "historical_sha256_match_in_git_objects": found.get(HISTORICAL, []),
              "head_script_object_control": found.get(head_digest, []),
              "scope": "all Git objects fetched from advertised branch and tag refs; unadvertised server-side dangling objects are not guaranteed to be transferred",
          }
          report = Path(os.environ["RUNNER_TEMP"]) / "e2-provenance-scan.json"
          report.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          if found.get(HISTORICAL):
              oid = found[HISTORICAL][0]["git_blob_oid"]
              print("GIT_LOG_FIND_OBJECT:")
              print(git("log", "--all", f"--find-object={oid}", "--oneline").stdout.decode())
          PY
      - name: Upload provenance report and recovered source if found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-provenance-sha256-scan
          path: |
            ${{ runner.temp }}/e2-provenance-scan.json
            ${{ runner.temp }}/e2_explore_d1488e80.py
          if-no-files-found: warn
