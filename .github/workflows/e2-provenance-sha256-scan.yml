name: E2 provenance SHA-256 object scan

on:
  push:
    branches:
      - forensics/e2-provenance-sha256-20261009

permissions:
  contents: read

jobs:
  scan-git-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan all locally available Git blob objects for the manifest SHA-256
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Fetch all advertised branches and tags before scanning:"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          echo "Remote branch count: $(git branch -r | wc -l)"
          echo "Current script SHA-256:"
          sha256sum experiments/e1_e2/e2_explore.py
          echo "Manifest-declared target:"
          grep -n "e2_explore.py" experiments/e1_e2/MANIFEST.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          targets = {
              "d1488e806b4a784f7776f9ce0979b66034f7bf3076b9f7f19b19cf22cd64f6a0": "manifest_historical",
              "e718d3e281c03ecf6409d7d39c0bdbf4a3b510d9fb47180f9016d27011e8a9d8": "known_current_control",
          }

          listing = subprocess.run(
              ["git", "cat-file", "--batch-all-objects",
               "--batch-check=%(objectname) %(objecttype) %(objectsize)"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()

          blob_oids = []
          for line in listing:
              fields = line.split()
              if len(fields) == 3 and fields[1] == "blob":
                  blob_oids.append(fields[0])

          # Batch-fetch contents once to avoid spawning one process per object.
          proc = subprocess.run(
              ["git", "cat-file", "--batch"],
              input="".join(oid + "\n" for oid in blob_oids).encode("ascii"),
              check=True, capture_output=True,
          )
          data = proc.stdout
          pos = 0
          found = {key: [] for key in targets}
          object_sizes = {}
          for expected_oid in blob_oids:
              end = data.find(b"\n", pos)
              if end < 0:
                  raise RuntimeError(f"Malformed cat-file header at byte {pos}")
              header = data[pos:end].decode("ascii").split()
              if len(header) != 3:
                  raise RuntimeError(f"Malformed cat-file header: {header!r}")
              oid, obj_type, size_text = header
              size = int(size_text)
              start = end + 1
              blob = data[start:start + size]
              if len(blob) != size or data[start + size:start + size + 1] != b"\n":
                  raise RuntimeError(f"Malformed blob payload for {oid}")
              digest = hashlib.sha256(blob).hexdigest()
              object_sizes[oid] = size
              if digest in targets:
                  found[digest].append({"git_blob_oid": oid, "size": size})
                  if digest == "d1488e806b4a784f7776f9ce0979b66034f7bf3076b9f7f19b19cf22cd64f6a0":
                      out = Path(os.environ["RUNNER_TEMP"]) / "e2_explore_d1488e80.py"
                      out.write_bytes(blob)
                      print(f"RECOVERED_REFERENCE={out}")
              pos = start + size + 1

          result = {
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "git_object_records": len(listing),
              "blob_objects_scanned": len(blob_oids),
              "targets": found,
              "scope": "all Git objects available in this checkout after fetch-depth: 0 across advertised branches and tags; not server-side dangling objects omitted by Git fetch",
          }
          report = Path(os.environ["RUNNER_TEMP"]) / "e2-provenance-scan.json"
          report.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          for digest, rows in found.items():
              for row in rows:
                  oid = row["git_blob_oid"]
                  print(f"GIT_BLOB_OID {digest} {oid}")
                  history = subprocess.run(
                      ["git", "log", "--all", f"--find-object={oid}", "--oneline"],
                      check=True, capture_output=True, text=True,
                  ).stdout
                  print("GIT_LOG_FIND_OBJECT_BEGIN")
                  print(history or "(no reachable commit names this object)")
                  print("GIT_LOG_FIND_OBJECT_END")
          if not found["e718d3e281c03ecf6409d7d39c0bdbf4a3b510d9fb47180f9016d27011e8a9d8"]:
              raise SystemExit("Known current script digest not found: scanner control failed")
          PY
          git log --all --format='%H %s' -- experiments/e1_e2/e2_explore.py | head -40
      - name: Upload provenance report and recovered source if found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-provenance-sha256-scan
          path: |
            ${{ runner.temp }}/e2-provenance-scan.json
            ${{ runner.temp }}/e2_explore_d1488e80.py
          if-no-files-found: warn
